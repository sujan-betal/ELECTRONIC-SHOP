<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ELECTRONICS SHOP</title>
    <!-- bootstrap css -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- google font link -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- external css link -->
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
</head>

<body style="background: var(--bg-light); height: 100vh; display: flex; align-items: center; justify-content: center;">

    <div class="fade-in" style="width: 100%; max-width: 500px; padding: 40px;">
        <div style="background: white; padding: 60px; border-radius: 40px; box-shadow: var(--shadow-hover); text-align: center;">
            <a href="index.html" style="text-decoration: none; color: inherit;">
                <h1 style="font-size: 32px; margin-bottom: 40px;"><span style="color: var(--primary-color);">E</span>Lectronic Shop</h1>
            </a>
            <h2 style="margin-bottom: 10px; font-size: 24px;">Welcome Back</h2>
            <p style="color: var(--text-light); margin-bottom: 40px;">Login to your account to continue.</p>
            
            <form>
                <div class="form-floating mb-4">
                    <input type="email" class="form-control form-control-lg" placeholder="Email Address" style="border: none; border-bottom: 2px solid #eee; border-radius: 0; padding-left: 0;">
                </div>
                <div class="form-floating mb-4">
                    <input type="password" class="form-control form-control-lg" placeholder="Password" style="border: none; border-bottom: 2px solid #eee; border-radius: 0; padding-left: 0;">
                </div>
                <button type="submit" class="contact-send-btn" style="width: 100%; margin-top: 20px;">SIGN IN</button>
            </form>
            
            <p style="margin-top: 30px; font-size: 14px;">Don't have an account? <a href="register.html" style="color: var(--primary-color); font-weight: 700; text-decoration: none;">Register here</a></p>
        </div>
    </div>

</body>

</html>
